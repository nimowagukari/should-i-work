openapi: 3.1.0
info:
  title: should-i-work API
  version: 1.0.0
  description: |
    指定した日付が労働日（出勤すべき日）かどうかを判定するシンプルな API。

tags:
  - name: workday
    description: 労働日判定に関するエンドポイント

paths:
  /v1/workday:
    get:
      tags: [workday]
      summary: 指定した日付が労働日かどうかを判定する
      description: |
        指定された日付が日本の祝日・振替休日・国民の休日・週末などを踏まえて
        勤務すべき日（労働日）かどうかを判定します。
        国やタイムゾーンは内部実装として固定（例: JP / Asia/Tokyo）とし、
        API インターフェースとしては `date` のみを要求します。
      parameters:
        - in: query
          name: date
          required: true
          description: 判定対象の日付 (ISO 8601 日付形式 `YYYY-MM-DD`)
          schema:
            type: string
            format: date
          example: "2026-05-03"
      responses:
        "200":
          description: 労働日判定結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkdayDecision"
        "400":
          description: 不正なリクエスト（例：日付形式が不正）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    WorkdayDecision:
      type: object
      required:
        - date
        - isWorkday
      properties:
        date:
          type: string
          format: date
          description: 判定対象の日付
          example: "2026-05-03"
        isWorkday:
          type: boolean
          description: 当日が労働日（出勤すべき日）であるかどうか
          example: false

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: エラーコード
          example: INVALID_DATE
        message:
          type: string
          description: エラーメッセージ
          example: "date は YYYY-MM-DD 形式で指定してください。"
        details:
          type: object
          additionalProperties: true
          description: エラーの詳細情報